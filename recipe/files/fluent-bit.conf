# ReadyStack Fluent Bit default configuration (classic format).
# Upstream's demo pipeline from conf/fluent-bit.conf (cpu -> stdout) with the built-in
# monitoring HTTP server and its health check switched on. Mount your own file over
# /fluent-bit/etc/fluent-bit.conf to run a real pipeline.
# The monitoring API on port 2020 has no authentication and no TLS: keep it on a private network.
[SERVICE]
    flush                  1
    daemon                 Off
    log_level              info
    parsers_file           parsers.conf
    http_server            On
    http_listen            0.0.0.0
    http_port              2020
    health_check           On
    hc_errors_count        5
    hc_retry_failure_count 5
    hc_period              60
    storage.path           /var/lib/fluent-bit/storage
    storage.metrics        on

[INPUT]
    name         cpu
    tag          cpu.local
    interval_sec 1

[OUTPUT]
    name  stdout
    match *
